# Instant Forge Sync - Triggers propagation to all forges on push/release
name: Instant Sync
on:
  push:
    branches: [main, master]
  release:
    types: [published]
permissions:
  contents: read
jobs:
  dispatch:
    # Only runs where the forge-farm dispatch is configured; skips (does not
    # fail) elsewhere. Enable by setting repo variable INSTANT_SYNC_ENABLED=true
    # (mirrors the push-email-notify.yml gating pattern).
    if: ${{ vars.INSTANT_SYNC_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FARM_DISPATCH_TOKEN: ${{ secrets.FARM_DISPATCH_TOKEN }}
    steps:
      - name: Trigger Propagation
        if: env.FARM_DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v4.0.1
        with:
          token: ${{ secrets.FARM_DISPATCH_TOKEN }}
          repository: hyperpolymath/.git-private-farm
          event-type: propagate
          client-payload: |-
            {
              "repo": "${{ github.event.repository.name }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "forges": ""
            }
      - name: Confirm
        if: env.FARM_DISPATCH_TOKEN != ''
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: echo "::notice::Propagation triggered for ${REPO_NAME}"
      - name: Report missing dispatch credential
        if: env.FARM_DISPATCH_TOKEN == ''
        run: echo '::notice::Forge propagation not attempted; FARM_DISPATCH_TOKEN is not configured.'
