#
# E2E + Aspect — exercises the Idris2/Zig ABI/FFI seam end-to-end.
#
# Builds libstateful_artefacts, runs the Zig unit + integration tests (which
# drive the library through its C ABI), and runs the aspect tests
# (SPDX headers, no-dangerous-proof-patterns, Idris2<->Zig symbol parity).

name: E2E + Aspect + Bench
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/e2e.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  e2e:
    name: E2E — FFI Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2
      - name: Build + test the ABI/FFI seam
        run: cd src/interface/ffi && zig build test --summary all
      - name: Aspect tests (SPDX, dangerous-patterns, ABI/FFI parity)
        run: bash tests/aspect_tests.sh
