name: Well-Known Standards (RFC 9116 + RSR)
on:
  push:
    branches: [main, master]
    paths:
      - 'www/.well-known/**'
      - '.well-known/**'
      - '.github/workflows/wellknown-enforcement.yml'
      - 'security.txt'
  pull_request:
    paths:
      - 'www/.well-known/**'
      - '.well-known/**'
      - '.github/workflows/wellknown-enforcement.yml'
  schedule:
    # Daily expiry check
    - cron: '0 9 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: RFC 9116 security.txt validation
        run: |
          SECTXT=""
          [ -f ".well-known/security.txt" ] && SECTXT=".well-known/security.txt"
          [ -f "security.txt" ] && SECTXT="security.txt"
          # The site-operations bundle is canonical (root allowlist).
          [ -f "www/.well-known/security.txt" ] && SECTXT="www/.well-known/security.txt"

          if [ -z "$SECTXT" ]; then
            echo "::error::No security.txt found — required for OpenSSF Best Practices. See https://github.com/hyperpolymath/well-known-ecosystem"
            exit 1
          fi

          # Required: Contact
          grep -q "^Contact:" "$SECTXT" || { echo "::error::Missing Contact field"; exit 1; }

          # Required: Expires
          if ! grep -q "^Expires:" "$SECTXT"; then
            echo "::error::Missing Expires field"
            exit 1
          fi

          # Check expiry
          EXPIRES=$(grep "^Expires:" "$SECTXT" | cut -d: -f2- | tr -d ' ' | head -1)
          if date -d "$EXPIRES" > /dev/null 2>&1; then
            REMAINING=$(( $(date -d "$EXPIRES" +%s) - $(date +%s) ))
            DAYS=$(( REMAINING / 86400 ))
            if [ "$REMAINING" -le 0 ]; then
              echo "::error::security.txt EXPIRED"
              exit 1
            elif [ $DAYS -lt 30 ]; then
              echo "::warning::security.txt expires in $DAYS days"
            else
              echo "✅ security.txt valid ($DAYS days)"
            fi
          else
            echo "::error::Invalid security.txt Expires timestamp"
            exit 1
          fi
      - name: RSR well-known compliance
        run: |
          MISSING=""
          [ ! -f "www/.well-known/security.txt" ] && [ ! -f ".well-known/security.txt" ] && [ ! -f "security.txt" ] && MISSING="$MISSING security.txt"
          [ ! -f "www/.well-known/ai.txt" ] && [ ! -f ".well-known/ai.txt" ] && MISSING="$MISSING ai.txt"
          [ ! -f "www/.well-known/humans.txt" ] && [ ! -f ".well-known/humans.txt" ] && MISSING="$MISSING humans.txt"

          if [ -n "$MISSING" ]; then
            echo "::warning::Missing RSR recommended files:$MISSING"
            echo "Reference: https://github.com/hyperpolymath/well-known-ecosystem/.well-known/"
          else
            echo "✅ RSR well-known compliant"
          fi
      - name: Mixed content check
        run: bash scripts/check-http-urls.sh --mixed-content .
      - name: DNS security records check
        if: hashFiles('CNAME') != ''
        run: |
          DOMAIN=$(cat CNAME 2>/dev/null | tr -d '\n')
          if [ -n "$DOMAIN" ]; then
            echo "Checking DNS for $DOMAIN..."
            # CAA record
            dig +short CAA "$DOMAIN" | grep -q "issue" && echo "✅ CAA record" || echo "::warning::No CAA record"
            # DNSSEC
            dig +dnssec +short "$DOMAIN" | grep -q "RRSIG" && echo "✅ DNSSEC" || echo "::warning::No DNSSEC"
          fi
