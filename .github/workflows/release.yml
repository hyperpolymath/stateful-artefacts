name: Release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/workflows/actions.lock'
      - 'tests/aspect_tests.sh'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'README.adoc'
      - 'scripts/package-release.sh'
      - 'tests/package-release_test.sh'
      - 'src/core/**'
      - 'src/interface/**'
  # Dispatch is a packaging dry run, never a publication trigger.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify release package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.package.outputs.hashes }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged source to have landed on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2
      - name: Packaging contract tests
        run: bash tests/package-release_test.sh
      - name: Build, test and package the actual library
        id: package
        run: bash scripts/package-release.sh "$RUNNER_TEMP/release"
      - name: Retain package and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14
  provenance:
    name: Attest verified release artifact
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release
      - name: Verify subjects before attestation
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Generate GitHub artifact provenance
        id: attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*.tar.gz
      - name: Retain signed bundle for release
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: cp -- "$BUNDLE_PATH" "$RUNNER_TEMP/stateful-artefacts.sigstore.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-provenance
          path: ${{ runner.temp }}/stateful-artefacts.sigstore.json
          if-no-files-found: error
          retention-days: 14
  release:
    name: Publish verified package and provenance
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-provenance
          path: provenance
      - name: Verify downloaded package integrity
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create release with real assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
            provenance/*.sigstore.json
