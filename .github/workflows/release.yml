name: Release
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'scripts/package-release.sh'
      - 'tests/package-release_test.sh'
      - 'src/core/**'
      - 'src/interface/**'
  # Dispatch is a packaging dry run, never a publication trigger.
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and verify release package
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      hashes: ${{ steps.package.outputs.hashes }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged source to have landed on main
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: git merge-base --is-ancestor HEAD origin/main
      - uses: goto-bus-stop/setup-zig@abea47f85e598557f500fa1fd2ab7464fcb39406 # v2.2.1
        with:
          version: 0.15.2
      - name: Packaging contract tests
        run: bash tests/package-release_test.sh
      - name: Build, test and package the actual library
        id: package
        run: bash scripts/package-release.sh "$RUNNER_TEMP/release"
      - name: Retain package and checksums
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-package
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 14
  provenance:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    permissions:
      actions: read
      id-token: write
      contents: write
    # SHA-pinned isolated generator; compile because its binary download path
    # requires a version tag rather than a commit SHA. Subjects are real hashes.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: ${{ needs.build.outputs.hashes }}
      compile-generator: true
      provenance-name: stateful-artefacts.intoto.jsonl
  release:
    name: Publish verified package and provenance
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, provenance]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-package
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: provenance
      - name: Verify downloaded package integrity
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Create release with real assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.tar.gz
            release/SHA256SUMS
            provenance/*.intoto.jsonl
